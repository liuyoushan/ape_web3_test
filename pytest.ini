[pytest]
# 测试目录
testpaths = tests

# 命令行参数
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# 标记定义
markers =
    P0: P0 级测试（核心功能）
    P1: P1 级测试（重要功能）
    P2: P2 级测试（次要功能）
    ERC20: ERC20 代币测试
    DEX: DEX 交易测试
    Liquidation: 清算测试
    Security: 安全测试
    NFT: NFT 测试
    CEX: CEX API 测试
    Account: 账户测试
    Trade: 交易测试
    Deposit: 充值测试
    Withdraw: 提币测试
    Transfer: 划转测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# 文件日志
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 最小版本
minversion = 7.0

# Python 文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*