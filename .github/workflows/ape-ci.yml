name: Ape-Demo Contract & Test CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "ape-config.yaml"
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "framework/**"
      - ".github/workflows/ape-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ape-config.yaml"
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "framework/**"
      - ".github/workflows/ape-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  ape_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ape & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all contracts
        run: ape compile

      - name: Lint python code
        run: flake8 scripts/ tests/ framework/ --max-line-length=120 || true

      - name: Install Foundry (retry up to 3 times)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        continue-on-error: true

      - name: Retry Install Foundry if failed
        if: failure()
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        continue-on-error: true

      - name: Retry Install Foundry again if still failed
        if: failure()
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start Anvil fork node
        run: |
          anvil \
            --fork-url "https://eth.drpc.org" \
            --fork-block-number 19500000 \
            --chain-id 1 \
            --balance 100000 \
            --port 8545 \
            --host 0.0.0.0 \
            --silent &
          sleep 5
          # 验证节点存活
          curl -sf -X POST http://127.0.0.1:8545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            || (echo "Anvil 启动失败" && exit 1)

      - name: Run deploy smoke test
        run: ape run deploy --network ethereum:local

      - name: Install Allure
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq npm
          npm install -g allure-commandline

      - name: Execute all pytest test cases
        run: python run_tests.py --no-report

      - name: Generate Allure report
        if: always()
        run: python run_tests.py --no-clean
        continue-on-error: true

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: report/allure-report/
          retention-days: 30

      - name: Clean up Anvil process
        if: always()
        run: pkill -f anvil || true
