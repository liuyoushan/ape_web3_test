name: Ape-Demo Contract & Test CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "ape-config.yaml"
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "framework/**"
      - ".github/workflows/ape-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ape-config.yaml"
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "framework/**"
      - ".github/workflows/ape-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  ape_verify:
    runs-on: ubuntu-latest
    # CEX 用例需要币安测试网密钥；未配置 secrets 时 conftest 会自动跳过 CEX 用例
    env:
      CEX_API_KEY: ${{ secrets.CEX_API_KEY }}
      CEX_API_SECRET: ${{ secrets.CEX_API_SECRET }}
      CEX_BASE_URL: https://testnet.binance.vision
      # 可选：配置 secrets.FORK_RPC_URL 可替换公开 RPC（公开 RPC 可能限流）
      FORK_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://eth.drpc.org' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ape & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 提前暴露依赖冲突（不阻塞，仅告警）
          pip check || true

      - name: Cache solc compiler
        uses: actions/cache@v4
        with:
          path: ~/.solcx
          key: solc-${{ runner.os }}-0.8.35

      - name: Compile all contracts
        run: ape compile

      - name: Lint python code
        run: flake8 scripts/ tests/ framework/ --max-line-length=120 || true

      - name: Install Foundry (retry up to 3 times)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        continue-on-error: true

      - name: Retry Install Foundry if failed
        if: failure()
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        continue-on-error: true

      - name: Retry Install Foundry again if still failed
        if: failure()
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Start Anvil fork node
        run: |
          anvil \
            --fork-url "$FORK_RPC_URL" \
            --fork-block-number 19500000 \
            --chain-id 1 \
            --balance 100000 \
            --port 8545 \
            --host 0.0.0.0 \
            --silent &
          sleep 5
          # 验证节点存活
          curl -sf -X POST http://127.0.0.1:8545 \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            || (echo "Anvil 启动失败" && exit 1)

      - name: Run deploy smoke test
        run: ape run deploy --network ethereum:local

      - name: Install Allure
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq npm
          npm install -g allure-commandline

      - name: Execute all pytest test cases
        run: python run_tests.py

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: report/allure-report/
          retention-days: 30

      - name: Clean up Anvil process
        if: always()
        run: pkill -f anvil || true
