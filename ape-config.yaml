name: ape-demo

plugins:
  - name: solidity
  - name: anvil
  - name: etherscan
  - name: alchemy

ethereum:
  default_network: local
  disable_automatic_node: true

  local:
    default_provider: test
    disable_automatic_node: true
    anvil:
      # 关键：告诉 ape 不要自己启动节点，只连接已有的节点
      # 不配置任何启动参数，让它无法自动启动
      no_start: true

test:
  mnemonic: "test test test test test test test test test test test junk"
  number_of_accounts: 20

# 注意：ape 0.8+ 使用插件名作为配置段（solidity:），
# 旧写法 compiler.solc.* 不会生效（会被静默忽略）。
# contracts 使用 ^0.8.20 pragma，0.8.35 兼容且为当前已验证版本。
solidity:
  version: "0.8.35"
  optimize: true
  optimization_runs: 1000000
