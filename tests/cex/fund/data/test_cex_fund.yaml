# ==============================================================================
# CEX 资金链路测试数据（32 用例精简版）
# ==============================================================================

# 通用配置
common:
  base_url: "https://testnet.binance.vision"
  symbol: "BTCUSDT"
  coin: "BTC"
  quote_coin: "USDT"

# ---------- 账户模块 (case_001 ~ case_004) ----------
account:
  case_001:
    verify_fields: ["asset", "free", "locked", "freeze"]
    precision: 8
  
  case_002:
    key_levels: ["READONLY", "TRADE", "WITHDRAW"]
    expected_blocked:
      READONLY: ["TRADE", "WITHDRAW"]
      TRADE: ["WITHDRAW"]
  
  case_003:
    expected_field: "subAccounts"
    min_count: 0
  
  case_004:
    verify_fields: ["totalWalletBalance", "totalUnrealizedProfit", "totalMarginBalance"]

# ---------- 充币模块 (case_013 ~ case_015) + 差异化 (case_029, case_030) ----------
deposit:
  case_013:
    coin: "BTC"
    expected_fields: ["txId", "amount", "coin", "status", "insertTime"]
  
  case_014:
    coin: "BTC"
    address_prefix: ["1", "3", "bc1"]
  
  case_015:
    tx_hash: "0xabc123def456789"
    amount: 0.001
    address: "0xTestAddress000000000000000000000000"
    confirmations: 10
  
  case_029:
    amount: 0.001
    rollback_block: 100
    expected_balance_delta: -0.001
  
  case_030:
    amount: 0.001
    tx_hash: "0xduplicate789"
    duplicate_count: 2

# ---------- 提币模块 (case_016 ~ case_020) + 差异化 (case_031) ----------
withdraw:
  case_016:
    coin: "BTC"
    amount: 0.0001
    address: "tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx"
    large_amount: 999999
    expected_fields: ["id", "width"]
  
  case_017:
    coin: "BTC"
    amount: 0.0001
    address: "tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx"
  
  case_018:
    coin: "BTC"
    amount: 0.0001
    address: "tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx"
  
  case_019:
    coin: "BTC"
    expected_fields: ["id", "amount", "address", "status"]
  
  case_020:
    coin: "BTC"
    amount: 0.0001
    address: "tb1qw508d6qejxtdg4y5r3zarvary0c5xw7kxpjzsx"
  
  case_031:
    amount: 0.0005
    chain_fail_reason: "network_timeout"
    expected_refund: true

# ---------- 划转模块 (case_021 ~ case_024) ----------
transfer:
  case_021:
    asset: "BTC"
    amount: 0.0001
    from_account: "SPOT"
    to_account: "FUTURES"
  
  case_022:
    asset: "BTC"
    amount: 0.0001
    from_account: "FUTURES"
    to_account: "SPOT"
  
  case_023:
    asset: "USDT"
    limit: 10
  
  case_024:
    asset: "BTC"
    amount: 0.0001
    tolerance: 1e-8
