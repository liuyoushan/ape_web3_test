# ==============================================================================
# ERC20 测试数据
# ==============================================================================
common:
  token_name: "MyToken"              # 代币名称
  token_symbol: "MTK"                # 代币符号
  expected_decimals: 18              # 预期小数位数
  expected_initial_supply: 0         # 预期初始供应量

# 正常转账测试用例
case_002_transfer:
  mint_amount: "1000 ether"          # 铸造金额
  transfer_amount: "200 ether"       # 转账金额

# 余额不足转账测试用例
case_003_insufficient_transfer:
  balance: "100 ether"               # 账户余额
  transfer_amount: "200 ether"       # 尝试转账金额（超过余额）

# 授权测试用例
case_004_approve:
  approve_amount: "500 ether"        # 授权金额

# 授权转账测试用例
case_005_transfer_from:
  mint_amount: "1000 ether"          # 铸造金额
  approve_amount: "300 ether"        # 授权金额
  transfer_amount: "200 ether"       # 使用授权转账金额

# 铸造测试用例
case_006_mint:
  mint_amount: "500 ether"           # 铸造金额

# 销毁测试用例
case_007_burn:
  mint_amount: "1000 ether"          # 铸造金额
  burn_amount: "200 ether"           # 销毁金额
  approve_amount: "300 ether"        # 授权销毁金额
  burn_from_amount: "100 ether"      # 使用授权销毁金额
  excess_burn_amount: "1000 ether"   # 超额销毁金额（超过余额）
